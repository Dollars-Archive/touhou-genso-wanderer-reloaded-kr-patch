name: One-shot add Nito worklog images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-add-nito-worklog-images.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/worklog
          cat .github/worklog-upload/dismantle.part1 .github/worklog-upload/dismantle.part2 .github/worklog-upload/dismantle.part3 | base64 -d > docs/assets/worklog/2026-09-13-nito-dismantle-tutorial.webp
          cat .github/worklog-upload/fusion.part1 .github/worklog-upload/fusion.part2 .github/worklog-upload/fusion.part3 .github/worklog-upload/fusion.part4 | base64 -d > docs/assets/worklog/2026-09-13-nito-fusion-tutorial.webp
          echo '49e0fac8c3f22cdf9fa778c4e72ca0d0ae4f2f15855a27ca2fcbb84c47ec24f4  docs/assets/worklog/2026-09-13-nito-dismantle-tutorial.webp' | sha256sum -c -
          echo 'd50e2507f6119cc74436e4c3b33ac77d3e4d0c0f44384e64baa98faba2d12d4b  docs/assets/worklog/2026-09-13-nito-fusion-tutorial.webp' | sha256sum -c -
          rm -rf .github/worklog-upload
          rm .github/workflows/one-shot-add-nito-worklog-images.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add Nito tutorial comparison images"
          git push origin HEAD:main
