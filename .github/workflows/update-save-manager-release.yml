name: One-shot update save manager release

on:
  push:
    paths:
      - ".github/workflows/update-save-manager-release.yml"

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'chore: update save manager release notes'
    runs-on: ubuntu-latest
    steps:
      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = "# TODR 세이브 스냅샷 관리자 v1.0\n\n게임 진행 상황을 이름과 메모를 붙여 백업하고, 원하는 시점으로 안전하게 복원하는 **PC판 포터블 도구**입니다.\n설치나 Python이 필요하지 않으며, 백업 자료는 프로그램 옆 `data` 폴더에 저장됩니다.\n\n## 기본 사용법\n\n1. ZIP을 쓰기 가능한 일반 폴더에 압축 해제합니다.\n2. 게임을 완전히 종료합니다.\n3. `TODR_Save_Manager_v1.0.exe`를 실행합니다.\n4. 프로그램이 세이브 폴더를 자동으로 찾았는지 상단 경로를 확인합니다.\n5. 이름과 필요한 경우 메모를 입력하고 **슬롯 1 / 슬롯 2 / 전체 슬롯** 중 백업 대상을 고릅니다.\n6. **새 스냅샷**을 누릅니다.\n7. 되돌리고 싶을 때 목록에서 스냅샷을 선택합니다.\n8. 복원할 슬롯을 고른 뒤 **선택 슬롯 복원**을 누릅니다.\n\n## 기본 세이브 경로\n\nWindows의 사용자별 Known Documents 아래 경로를 자동으로 사용합니다.\n\n`My Games\\Touhou Genso Wanderer -Reloaded-`\n\n문서 폴더를 다른 드라이브나 OneDrive로 옮긴 사용자도 Windows가 알려주는 실제 문서 경로를 사용합니다.\n자동 경로가 맞지 않으면 **폴더 변경**에서 세이브 폴더를 직접 선택하세요.\n\n## 슬롯 선택 기능\n\n### 슬롯 1\n- `savedata1.sav` 및 `savedata1.sav.bak`만 백업·복원합니다.\n- 슬롯 2와 공용 설정은 바뀌지 않습니다.\n\n### 슬롯 2\n- `savedata2.sav` 및 `savedata2.sav.bak`만 백업·복원합니다.\n- 슬롯 1과 공용 설정은 바뀌지 않습니다.\n\n### 전체 슬롯\n- 현재 존재하는 모든 `savedata` 숫자 슬롯을 함께 백업·복원합니다.\n- 백업 시점에 없던 슬롯은 전체 슬롯 복원 시 백업 당시 상태에 맞춰 제거될 수 있습니다.\n\n### 공용 설정 파일\n- `config.sav`, `keyconfig.json`, `userprefs.json` 계열은 백업·복원하지 않습니다.\n- 그래픽, 키 배치와 사용자 설정은 항상 현재 상태를 유지합니다.\n- 기존 버전 백업에 설정 파일이 들어 있어도 새 버전은 해당 파일을 복원하지 않습니다.\n\n### 방금 상태로 돌아가기\n- 마지막으로 복원한 슬롯의 복원 직전에 자동 생성된 구조백으로 다시 돌아갑니다.\n- 잘못된 시점을 골랐을 때 즉시 이전 상태로 복귀하는 용도입니다.\n- 버튼을 누르면 기능 설명과 예/아니오 확인창이 먼저 나타납니다.\n\n## 완료 알림\n\n- 새 스냅샷 생성이 끝나면 **백업 완료** 팝업이 나타납니다.\n- 선택한 슬롯 복원이 끝나면 **복원 완료** 팝업이 나타납니다.\n- 방금 상태로 돌아가기가 끝나면 **되돌리기 완료** 팝업이 나타납니다.\n- 완료 팝업은 로컬 파일 SHA-256 검증까지 성공했다는 의미입니다.\n\n## 안전 장치\n\n- 게임 프로세스가 실행 중이면 백업과 복원을 차단합니다.\n- 세이브가 검사 도중 변경되면 작업을 중단합니다.\n- 모든 백업 파일을 SHA-256으로 검증합니다.\n- 복원 직전에 선택한 슬롯의 현재 상태를 자동 구조백합니다.\n- 복원 중 오류가 나면 적용 전 상태로 원복을 시도하고 결과를 기록합니다.\n- `steam_autocloud.vdf`와 알 수 없는 파일은 관찰만 하며 복사하거나 복원하지 않습니다.\n- 세이브 내용을 해석하거나 수정하지 않고 슬롯 파일 단위로 보관합니다.\n\n## Steam Cloud 주의\n\n복원 전에는 게임을 완전히 종료하고 **Steam Cloud를 반드시 끄세요.**\nSteam Cloud를 끌 수 없는 경우에는 Steam을 오프라인으로 전환한 뒤 복원하세요.\nCloud가 켜져 있으면 복원한 로컬 세이브가 클라우드 파일로 다시 덮어써질 수 있습니다.\n\n복원 완료 후에는 게임을 실행하여 복원된 세이브가 정상인지 확인하고 새로 저장하세요.\n그다음 Steam Cloud를 다시 켜고 동기화 충돌 창이 나타나면 복원한 로컬 파일을 선택하세요.\n\n프로그램의 성공 메시지는 **로컬 파일 SHA-256 검증을 통과했다는 의미**이며,\nSteam Cloud 동기화 결과나 다음 게임 실행 결과까지 보장하지는 않습니다.\n\n## 포터블 data 폴더\n\n- `data\\snapshots`: 사용자가 만든 백업과 복원 전 자동 구조백\n- `data\\transactions`: 복원 작업 기록\n\n`data` 폴더에는 개인 세이브가 들어갑니다.\n프로그램을 다른 사람에게 전달하거나 공개 저장소에 올릴 때는 반드시 빈 배포 ZIP을 사용하고,\n사용 중인 `data` 폴더를 함께 공유하지 마세요.\n\n## 문제 해결\n\n- 게임 실행 중 오류: 게임을 완전히 종료한 뒤 새로고침하고 다시 시도하세요.\n- 프로세스 확인 실패: 보안 프로그램이나 Windows 권한 설정을 확인하세요.\n- 세이브 폴더 없음: **폴더 변경**으로 `savedata1.sav`가 있는 폴더를 선택하세요.\n- Steam Cloud가 복원값을 되돌림: Cloud를 끄거나 Steam 오프라인 상태에서 다시 복원하세요.\n- 손상 경고: 원본과 `data` 폴더를 그대로 보존하고 `transactions` 기록과 함께 문의하세요.\n"
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/releases/398031972"
          payload = json.dumps({"body": body}).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          print(data["html_url"])
          PY
