name: One-shot update save manager release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-save-manager-release.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update save manager release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit save-manager-v1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file .github/save-manager-release.md
