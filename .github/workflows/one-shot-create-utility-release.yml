name: One-shot create utility release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-create-utility-release.yml'

permissions:
  contents: write

jobs:
  release-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create utility release and update README
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main

          cat > /tmp/utility-release-notes.md <<'EOF'
          # 이상한 환상향 TOD -RELOADED- 유틸리티 v1.0

          한국어 패치 본체와 별도로 배포하는 **유틸리티 프로그램 전용 릴리즈**입니다.

          ## 배포 안내

          - 한국어 패치 본체와 별도 버전으로 관리합니다.
          - 유틸리티 프로그램은 이 릴리즈에서 별도로 배포합니다.
          - 한국어 패치가 필요한 경우 [한국어 패치 v1.0](https://github.com/Dollars-Archive/touhou-genso-wanderer-reloaded-kr-patch/releases/tag/v1.0)을 이용해 주세요.

          > 유틸리티 프로그램과 한국어 패치는 서로 다른 릴리즈로 관리됩니다.
          EOF

          if gh release view utility-v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit utility-v1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "이상한 환상향 TOD -RELOADED- 유틸리티 v1.0" \
              --notes-file /tmp/utility-release-notes.md
          else
            gh release create utility-v1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "이상한 환상향 TOD -RELOADED- 유틸리티 v1.0" \
              --notes-file /tmp/utility-release-notes.md
          fi

          python - <<'PY'
          from pathlib import Path

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")

          release_url = "https://github.com/Dollars-Archive/touhou-genso-wanderer-reloaded-kr-patch/releases/tag/utility-v1.0"

          top_block = f"""
          > [!NOTE]
          > 한국어 패치와 별도로 사용할 수 있는 **이상한 환상향 TOD -RELOADED- 유틸리티 프로그램**도 제공합니다.  
          > **[유틸리티 v1.0 릴리즈 바로가기]({release_url})**
          """

          if "releases/tag/utility-v1.0" not in s:
              anchor = "설치 및 적용 방법은 **[웹 설치 가이드](https://dollars-archive.github.io/touhou-genso-wanderer-reloaded-kr-patch/)**를 확인해 주세요.\n"
              if s.count(anchor) != 1:
                  raise SystemExit("README top anchor mismatch")
              s = s.replace(anchor, anchor + "\n" + top_block.strip() + "\n", 1)

          section_heading = "## 유틸리티 프로그램"
          if section_heading not in s:
              section = f"""
          ## 유틸리티 프로그램

          한국어 패치 본체와 별도로 관리·배포하는 **이상한 환상향 TOD -RELOADED- 유틸리티 프로그램**입니다.

          **[유틸리티 v1.0 릴리즈 바로가기]({release_url})**

          > 패치 본체와 유틸리티는 서로 다른 릴리즈로 관리됩니다.

          <br>

          """
              anchor2 = "## 다운로드\n"
              if s.count(anchor2) != 1:
                  raise SystemExit("README download anchor mismatch")
              s = s.replace(anchor2, section.lstrip() + anchor2, 1)

          p.write_text(s, encoding="utf-8")
          PY

          rm .github/workflows/one-shot-create-utility-release.yml

      - name: Commit README and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/one-shot-create-utility-release.yml
          git diff --cached --check
          git diff --cached -- README.md
          git commit -m "docs: add utility release link"
          git push origin HEAD:main
