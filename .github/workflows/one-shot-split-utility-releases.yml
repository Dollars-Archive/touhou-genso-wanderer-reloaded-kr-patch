name: One-shot split utility releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-split-utility-releases.yml'

permissions:
  contents: write

jobs:
  split-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Create separate utility releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/trainer-notes.md <<'EOF'
          # TODR Self QA 검수 트레이너 v1.0

          한글화 결과를 빠르게 확인하기 위한 **Steam PC판 전용 포터블 검수 도구**입니다.
          설치할 필요가 없으며 EXE 하나로 실행됩니다.

          ## 지원 게임

          - Steam PC판 Touhou Genso Wanderer -Reloaded-
          - 실행 파일명: `LotusLandVReloaded.exe`
          - 지원 SHA-256: `1d9b0746867441adedf1f50977ac3f8558321dc5d64a88a675b129c6187b7761`

          게임 설치 위치는 C:, D:, E: 등 어디든 상관없으며 실행 중인 게임 프로세스의 실제 경로를 자동으로 읽습니다.
          지원하지 않는 실행 파일 버전은 메모리를 변경하지 않고 안전하게 종료합니다.

          ## 빠른 사용법

          1. `TODR_Self_QA_v1.0.exe`를 실행합니다.
          2. 게임이 아직 실행되지 않았다면 도구가 자동으로 기다립니다.
          3. Steam에서 Touhou Genso Wanderer -Reloaded-를 실행합니다.
          4. 게임 프로세스가 하나 확인되면 자동으로 연결됩니다.
          5. 던전에서 아래 단축키를 사용합니다.

          ## 단축키

          - **F6** MAX DAMAGE 켜기 / 끄기
          - **F7** 마법진 자동 이동 시작 / 안전 중지
          - **F8** 무적 켜기 / 끄기
          - **F9** 검수 도구 종료

          ## 기능 설명

          ### F6 MAX DAMAGE
          플레이어 공격 피해를 크게 올립니다. F7 실행 전에는 충돌 방지를 위해 자동으로 해제됩니다.

          ### F7 마법진 자동 이동
          현재 일반층의 정상 마법진을 찾아 다음 층으로 이동합니다. 다음 일반층에서도 반복하며 최종층·특수층·안전 조건 불충족 시 중지합니다.
          스토리 진행 조건, 보스 처치 또는 특수 기믹이 필요한 층은 직접 진행해야 할 수 있습니다.

          ### F8 무적
          게임의 무적 조건을 이용하고 만복도를 유지합니다. F7 층 이동 중에는 안전을 위해 잠시 해제한 뒤 복원합니다.

          ## 안전 주의사항

          - 싱글 플레이 한글화 검수용으로만 사용하세요.
          - 게임 업데이트 후 `unsupported executable version`이 나오면 사용을 중단하세요.
          - 강제 종료보다 F9로 끝내는 것을 권장합니다. F9 종료 시 적용한 훅과 상태를 복구합니다.
          - 백신에서 메모리 조작 도구로 탐지할 수 있습니다. 출처와 SHA-256을 확인하세요.
          - 관리자 권한 오류가 나오면 게임과 도구의 권한 수준을 동일하게 맞추세요.
          - 세이브 파일을 직접 수정하지는 않지만 중요한 세이브는 별도로 백업하세요.

          ## 문제 해결

          - 게임 실행 대기에서 멈춤: 작업 관리자에서 `LotusLandVReloaded.exe`가 하나만 실행 중인지 확인하세요.
          - 버전 불일치: Steam 파일 무결성 검사 후 다시 실행하세요.
          - 액세스 거부: 게임과 도구 중 한쪽만 관리자 권한인지 확인하세요.
          - F7 안전 중지: 해당 층의 스토리·보스·기믹을 직접 처리한 뒤 다시 누르세요.
          EOF

          cat > /tmp/save-notes.md <<'EOF'
          # TODR 세이브 스냅샷 관리자 v1.0

          게임 진행 상황을 이름과 메모를 붙여 백업하고 원하는 시점으로 안전하게 복원하는 **PC판 포터블 도구**입니다.
          설치나 Python이 필요하지 않으며 백업 자료는 프로그램 옆 `data` 폴더에 저장됩니다.

          ## 기본 사용법

          1. ZIP을 쓰기 가능한 일반 폴더에 압축 해제합니다.
          2. 게임을 완전히 종료합니다.
          3. `TODR_Save_Manager_v1.0.exe`를 실행합니다.
          4. 프로그램이 세이브 폴더를 자동으로 찾았는지 상단 경로를 확인합니다.
          5. 이름과 필요한 경우 메모를 입력한 뒤 **새 스냅샷**을 누릅니다.
          6. 되돌리고 싶을 때 목록에서 스냅샷을 선택합니다.
          7. **진행만 복원** 또는 **전체 상태 복원**을 누릅니다.

          ## 기본 세이브 경로

          Windows의 사용자별 Known Documents 아래 경로를 자동으로 사용합니다.

          `My Games\Touhou Genso Wanderer -Reloaded-`

          문서 폴더를 다른 드라이브나 OneDrive로 옮긴 사용자도 Windows가 알려주는 실제 문서 경로를 사용합니다.
          자동 경로가 맞지 않으면 **폴더 변경**에서 세이브 폴더를 직접 선택하세요.

          ## 복원 기능 차이

          ### 진행만 복원
          - `savedata*.sav` 및 `savedata*.sav.bak`만 복원합니다.
          - 설정과 키 배치는 현재 상태를 유지합니다.

          ### 전체 상태 복원
          - 진행 데이터와 `config.sav`, `keyconfig.json`, `userprefs.json` 계열을 함께 복원합니다.
          - 설정과 키 배치까지 백업 당시 상태로 돌아갑니다.

          ### 방금 상태로 돌아가기
          - 복원 직전에 자동 생성된 구조백으로 다시 돌아갑니다.
          - 잘못된 시점을 골랐을 때 즉시 이전 상태로 복귀하는 용도입니다.

          ## 안전 장치

          - 게임 프로세스가 실행 중이면 백업과 복원을 차단합니다.
          - 세이브가 검사 도중 변경되면 작업을 중단합니다.
          - 모든 백업 파일을 SHA-256으로 검증합니다.
          - 복원 직전에 현재 상태의 자동 구조백을 만듭니다.
          - 복원 중 오류가 나면 적용 전 상태로 원복을 시도하고 결과를 기록합니다.
          - `steam_autocloud.vdf`와 알 수 없는 파일은 관찰만 하며 복사하거나 복원하지 않습니다.
          - 세이브 내용을 해석하거나 수정하지 않고 파일 단위로 보관합니다.

          ## Steam Cloud 주의

          복원 전에는 게임을 완전히 종료하고 **Steam Cloud를 반드시 끄세요.**
          Steam Cloud를 끌 수 없는 경우에는 Steam을 오프라인으로 전환한 뒤 복원하세요.
          Cloud가 켜져 있으면 복원한 로컬 세이브가 클라우드 파일로 다시 덮어써질 수 있습니다.

          복원 완료 후에는 게임을 실행하여 복원된 세이브가 정상인지 확인하고 새로 저장하세요.
          이후 Steam Cloud를 다시 켜고 동기화 충돌 창이 나타나면 복원한 로컬 파일을 선택하세요.

          ## 포터블 data 폴더

          - `data\snapshots`: 사용자가 만든 백업과 복원 전 자동 구조백
          - `data\transactions`: 복원 작업 기록

          `data` 폴더에는 개인 세이브가 들어갑니다. 프로그램을 다른 사람에게 전달하거나 공개 저장소에 올릴 때는 사용 중인 `data` 폴더를 함께 공유하지 마세요.

          ## 문제 해결

          - 게임 실행 중 오류: 게임을 완전히 종료한 뒤 새로고침하고 다시 시도하세요.
          - 프로세스 확인 실패: 보안 프로그램이나 Windows 권한 설정을 확인하세요.
          - 세이브 폴더 없음: **폴더 변경**으로 `savedata1.sav`가 있는 폴더를 선택하세요.
          - Steam Cloud가 복원값을 되돌림: Cloud를 끄거나 Steam 오프라인 상태에서 다시 복원하세요.
          - 손상 경고: 원본과 `data` 폴더를 그대로 보존하고 `transactions` 기록과 함께 문의하세요.
          EOF

          if gh release view trainer-v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit trainer-v1.0 --repo "$GITHUB_REPOSITORY" --title "TODR Self QA 검수 트레이너 v1.0" --notes-file /tmp/trainer-notes.md
          else
            gh release create trainer-v1.0 --repo "$GITHUB_REPOSITORY" --target main --title "TODR Self QA 검수 트레이너 v1.0" --notes-file /tmp/trainer-notes.md
          fi

          if gh release view save-manager-v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit save-manager-v1.0 --repo "$GITHUB_REPOSITORY" --title "TODR 세이브 스냅샷 관리자 v1.0" --notes-file /tmp/save-notes.md
          else
            gh release create save-manager-v1.0 --repo "$GITHUB_REPOSITORY" --target main --title "TODR 세이브 스냅샷 관리자 v1.0" --notes-file /tmp/save-notes.md
          fi

          if gh release view utility-v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete utility-v1.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi
