name: Update v1.0 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-v1.0-release-notes.yml"

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update v1.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
# 이상한 환상향 TOD -RELOADED- 한국어 패치 v1.0

PC판과 Nintendo Switch판을 함께 배포합니다.  
**사용 환경에 맞는 패치 파일을 선택해 주세요.**

## 공통 한국어화 범위

- 대사 / 이벤트 / 메뉴 / UI
- 아이템 / 스킬 / 도감
- 캐릭터명, 기술명, 던전·지역·시설·NPC 명칭 최신 검수본
- 한글 폰트 및 동영상 자막
- 한글화 영상 및 튜토리얼 / 이벤트 이미지
- 일부 용어 및 줄바꿈 전수 보정
- 설치 시 **대체 배경 / 원본 게임 배경** 선택 가능

---

## 💻 PC판

**Steam PC판 전용 패키지입니다.**

### 설치

1. 게임과 관련 프로그램을 모두 종료합니다.
2. `PC_KR_설치.cmd`를 실행합니다.
3. `Touhou Genso Wanderer -Reloaded-` **최상위 게임 폴더**를 선택합니다.
4. 배경 옵션을 선택하면 자동으로 원본 검증 후 설치됩니다.

설치기는 원본 및 완성 파일의 **SHA-256을 검증**하며, 깨끗한 원본은 자동 백업합니다.

- 설치 확인: `PC_KR_검증.cmd`
- 원본 복구: `PC_KR_복구.cmd`

> [!TIP]
> 지원하지 않는 파일이라는 오류가 나오면 Steam의 **게임 파일 무결성 검사** 후 다시 설치해 주세요.

---

## 🎮 Nintendo Switch판

**지원 버전: v1.0.3**  
**Title ID: `01004E900B082000`**

### 설치

1. `이상한환상향_TODR_KR_Patcher.exe`를 실행합니다.
2. 지원 버전의 원본 게임 폴더와 결과 저장 위치를 선택합니다.
3. 배경 옵션을 선택하고 패치를 생성합니다.
4. 생성된 `atmosphere` 폴더를 SD 카드 루트에 복사합니다.

최종 경로:

`SD:\atmosphere\contents\01004E900B082000\romfs`

> [!WARNING]
> 기존 `SD:\atmosphere\contents\01004E900B082000` 폴더가 있다면 **먼저 백업 후 삭제하거나 완전히 비워 주세요.**  
> 이전 패치 위에 그대로 덮어쓰면 오래된 파일이 남아 충돌할 수 있습니다.

Switch 패쳐는 원본 파일을 직접 수정하지 않으며, **SHA-256 검증을 통과한 지원 원본에서만** 결과를 생성합니다.

---

## 배경 옵션

PC / Switch 모두 설치 중 아래 두 옵션 중 하나를 선택할 수 있습니다.

- **대체 배경 사용**
- **원본 게임 배경 유지**

번역이나 게임 내용에는 차이가 없으며, 나중에 패쳐를 다시 실행해 변경할 수 있습니다.

---

> 본 패치는 팬 제작 비공식 한국어 패치입니다.  
> 게임 본편 및 원본 게임 파일은 포함하지 않습니다.

EOF
          gh release edit v1.0             --repo "$GITHUB_REPOSITORY"             --notes-file /tmp/release-notes.md
